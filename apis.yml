name: SteadyGateway
description: >-
  Enterprise AI gateway providing production access to leading model families — GLM, Qwen, MiniMax,
  DeepSeek and Kimi — through a single OpenAI-compatible interface under one contract, with governed
  controls, per-customer isolation, documented model-freshness evidence, and a 99.9% availability
  commitment carrying tiered service credits. Access is CONTRACT-GATED: there is no self-serve
  signup, no published base URL and no public OpenAPI definition. The base URL and credentials are
  issued per contract, so the publicly consumable surface is an llms.txt plus buyer-oriented guides,
  a model catalogue and freshness benchmarks.
